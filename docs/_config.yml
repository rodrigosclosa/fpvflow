title: FPVFlow
description: >-
  Gyroflow fork for FPV pilots: gyro-based video stabilization with .cube LUT colour grading,
  an external audio track that syncs automatically, and a repair for the DJI O4 "Gyrogate"
  false rotations.
url: https://rodrigosclosa.github.io
baseurl: /fpvflow
lang: en

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: dark
logo: /assets/images/icon.png
favicon_ico: /assets/images/icon.png
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  Download: https://github.com/rodrigosclosa/fpvflow/releases/latest
  GitHub: https://github.com/rodrigosclosa/fpvflow
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/rodrigosclosa/fpvflow
gh_edit_branch: fpvflow
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: >-
  FPVFlow is a fork of <a href="https://github.com/gyroflow/gyroflow">Gyroflow</a> 1.6.3, licensed
  under GPL-3.0. Not an official Gyroflow release - all credit for the stabilization engine belongs
  to the Gyroflow authors.

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

exclude:
  - README.md
